[metadata]
name = mlops-ab-testing-framework
version = 0.1.0
description = Production-ready A/B testing framework for ML models
long_description = file: README.md
long_description_content_type = text/markdown
author = Harshith
author_email = harshithluc073@gmail.com
url = https://github.com/harshithluc073/mlops-ab-testing-framework
project_urls =
    Bug Tracker = https://github.com/harshithluc073/mlops-ab-testing-framework/issues
    Documentation = https://github.com/harshithluc073/mlops-ab-testing-framework#readme
    Source Code = https://github.com/harshithluc073/mlops-ab-testing-framework
license = MIT
license_files = LICENSE
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Topic :: Software Development :: Libraries :: Python Modules

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.8
install_requires =
    numpy>=1.21.0
    pandas>=1.3.0
    scikit-learn>=1.0.0
    scipy>=1.7.0
    matplotlib>=3.4.0
    seaborn>=0.11.0
    joblib>=1.1.0

[options.packages.find]
where = src

[options.extras_require]
explainability =
    shap>=0.41.0
    lime>=0.2.0
tracking =
    mlflow>=2.0.0
    wandb>=0.13.0
visualization =
    plotly>=5.0.0
dev =
    pytest>=7.0.0
    pytest-cov>=3.0.0
    black>=22.0.0
    flake8>=4.0.0
    mypy>=0.950
all =
    shap>=0.41.0
    lime>=0.2.0
    mlflow>=2.0.0
    wandb>=0.13.0
    plotly>=5.0.0

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=mlops_ab_testing
    --cov-report=term-missing
    --cov-report=html
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests

[coverage:run]
source = src/mlops_ab_testing
omit =
    */tests/*
    */test_*.py
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[flake8]
max-line-length = 100
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .eggs,
    *.egg-info,
    venv,
    .venv
ignore =
    E203,  # whitespace before ':'
    E501,  # line too long (handled by black)
    W503,  # line break before binary operator
per-file-ignores =
    __init__.py:F401

[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = True

[isort]
profile = black
line_length = 100
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True

[black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''