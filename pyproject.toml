[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-ab-testing-framework"
version = "0.1.0"
description = "Offline A/B testing framework for ML model evaluation with statistical analysis and automated reporting"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "harshithluc073", email = "your.email@example.com"}
]
maintainers = [
    {name = "harshithluc073", email = "your.email@example.com"}
]
keywords = [
    "machine-learning",
    "mlops",
    "ab-testing",
    "model-evaluation",
    "statistical-analysis",
    "explainability",
    "mlflow",
    "model-comparison"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
    "shap>=0.41.0",
    "mlflow>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "tqdm>=4.62.0",
    "jinja2>=3.0.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "isort>=5.10.0",
    "pre-commit>=2.17.0",
]

wandb = [
    "wandb>=0.13.0",
]

lime = [
    "lime>=0.2.0",
]

all = [
    "mlops-ab-testing-framework[dev,wandb,lime]",
]

[project.urls]
Homepage = "https://github.com/harshithluc073/mlops-ab-testing-framework"
Documentation = "https://github.com/harshithluc073/mlops-ab-testing-framework#readme"
Repository = "https://github.com/harshithluc073/mlops-ab-testing-framework"
Issues = "https://github.com/harshithluc073/mlops-ab-testing-framework/issues"

[project.scripts]
mlops-ab-test = "mlops_ab_testing.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=mlops_ab_testing --cov-report=html --cov-report=term-missing"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
